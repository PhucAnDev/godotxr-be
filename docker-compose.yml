services:
  api:
    build:
      context: .
      dockerfile: GodotXR.Api/Dockerfile
    container_name: godotxr-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: godotxr-redis
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 only so Redis isn't exposed externally,
      # while local Visual Studio runs can still reach localhost:6379
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:

